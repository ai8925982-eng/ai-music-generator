name: Build Windows Standalone

on:
  workflow_dispatch:        # Actions tab -> "Build Windows Standalone" -> Run workflow
  push:
    branches: [main, master]
    tags: ["v*"]            # git tag v0.2.0 && git push --tags -> also creates a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check project files are present
        shell: pwsh
        run: |
          $required = @(
            "run_app.py",
            "src/aimusicgen/__init__.py", "src/aimusicgen/cli.py", "src/aimusicgen/gui.py",
            "src/aimusicgen/pipeline.py", "src/aimusicgen/composer.py", "src/aimusicgen/synth.py",
            "src/aimusicgen/instruments.py", "src/aimusicgen/fx.py", "src/aimusicgen/pitch.py",
            "src/aimusicgen/vocal.py", "tools/make_test_vocal.py"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Project files are missing from the repository: $($missing -join ', ')"
            Write-Host "Upload the WHOLE project (run_app.py, src/, tests/, tools/ ...), not only the workflow file. See README."
            exit 1
          }
          Write-Host "All required files found."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy soundfile pytest pyinstaller

      - name: Run tests
        if: hashFiles('tests/test_pipeline.py') != ''
        continue-on-error: true      # a failing test does not stop the build
        run: python -m pytest -q

      - name: Build GUI - single file (AIMusicGenerator.exe)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIMusicGenerator --paths src --collect-all soundfile --collect-submodules aimusicgen run_app.py

      - name: Build GUI - portable folder (starts faster)
        run: python -m PyInstaller --noconfirm --onedir --windowed --name AIMusicGenerator-portable --paths src --collect-all soundfile --collect-submodules aimusicgen run_app.py

      - name: Build command-line exe
        run: python -m PyInstaller --noconfirm --onefile --console --name AIMusicGenerator-cli --paths src --collect-all soundfile --collect-submodules aimusicgen run_app.py

      - name: Smoke test - song from a FLAC vocal with the CLI exe (checks the bundled audio reader)
        shell: pwsh
        run: |
          python tools/make_test_vocal.py smoke_vocal.flac
          .\dist\AIMusicGenerator-cli.exe -g isan --vocal smoke_vocal.flac --bars 16 --seed 1 -o smoke_output -n smoke
          if (-not (Test-Path smoke_output\smoke.wav)) { Write-Host "::error::no wav produced"; exit 1 }
          if (-not (Test-Path smoke_output\smoke.mid)) { Write-Host "::error::no midi produced"; exit 1 }
          Write-Host "Generated:" (Get-Item smoke_output\smoke.wav).Length "bytes"

      - name: Smoke test - GUI exe starts and stays open
        shell: pwsh
        run: |
          foreach ($exe in @("dist\AIMusicGenerator.exe", "dist\AIMusicGenerator-portable\AIMusicGenerator-portable.exe")) {
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 12
            if ($p.HasExited) { Write-Host "::error::$exe closed by itself (exit code $($p.ExitCode))"; exit 1 }
            Stop-Process -Id $p.Id -Force
            Write-Host "$exe started fine"
          }

      - name: Package zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_single | Out-Null
          Copy-Item dist\AIMusicGenerator.exe, dist\AIMusicGenerator-cli.exe release_single\
          if (Test-Path README.md) { Copy-Item README.md release_single\ }
          Compress-Archive -Path release_single\* -DestinationPath AIMusicGenerator-windows.zip -Force

          Copy-Item dist\AIMusicGenerator-cli.exe dist\AIMusicGenerator-portable\
          if (Test-Path README.md) { Copy-Item README.md dist\AIMusicGenerator-portable\ }
          Compress-Archive -Path dist\AIMusicGenerator-portable -DestinationPath AIMusicGenerator-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AIMusicGenerator-windows
          path: |
            AIMusicGenerator-windows.zip
            AIMusicGenerator-portable.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AIMusicGenerator-windows.zip
            AIMusicGenerator-portable.zip
