[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimusicgen"
version = "0.1.0"
description = "AI Music Generator - audio + MIDI music generation with vocal preservation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "soundfile>=0.12.1"]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
aimusicgen = "aimusicgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
